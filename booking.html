    body {

.carousel-item ,.carousel-item1 {
            height: 70vh; /* Set a consistent height */

            align-items: center;
            position: relative;
        }

.carousel-item h5 {
        color: #FF7F50;

     }
.carousel-item img ,.carousel-item1 img{
            max-height: 100%; /* Ensures images fit within the carousel */
            object-fit: cover; /* Maintains aspect ratio and covers the area */
            width: 100%;
        }   
.carousel-caption {
            background: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
            color: white; /* Text color */
            padding: 15px; /* Spacing around the text */
            border-radius: 5px; /* Rounded corners */
            bottom: 20px; /* Positioning */
            text-align: center; /* Center text */
        }

h5 {
            font-size: 1.5em; /* Larger font size for headings */
            font-weight: bold; /* Bold headings */
        }

p {
            font-size: 1.1em; /* Adjusted font size for readability */
            line-height: 1.5; /* Increased line spacing for readability */
        }

        /* Custom styles for navigation arrows */
.carousel-control-prev-icon,
.carousel-control-next-icon {
        background-color: rgba(0, 0, 0, 0.5); /* Dark background for arrows */
        }

#contact {
    background-color: #f9f9f9;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.contact-title {
    color: #2c3e50;
    font-family: 'Arial', sans-serif;
    font-size: 24px;
    margin-bottom: 20px;
}

.contact-description {
    color: #34495e;
    font-family: 'Georgia', serif;
    font-size: 16px;
    margin-bottom: 30px;
}

.contact-info h3, .contact-form h3, .social-media h3 {
    color: #2980b9;
    font-family: 'Arial', sans-serif;
    margin-top: 20px;
}

.contact-info p, .social-media span {
    color: #7f8c8d;
}

.form-control {
    border: 1px solid #bdc3c7;
    border-radius: 5px;
    padding: 10px;
    margin-bottom: 15px;
    width: 100%;
}

.btn-primary {
    background-color: #2980b9;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    color: white;
    font-size: 16px;
}

.btn-primary:hover {
    background-color: #3498db;
}

.social-icon {
    height: 40px;
    width: 40px;
    margin: 0 10px;
}

.map-location iframe {
    border-radius: 10px;
}
#welcome-title {
    color: #2c3e50;
    font-family: 'Arial', sans-serif;
    font-size: 2.5em;
    margin: 20px 0;
}

.explore-subtitle {
    color: #2980b9;
    font-family: 'Georgia', serif;
    font-size: 1.8em;
    margin-bottom: 30px;
}

.intro-text {
    color: #34495e;
    font-size: 1.1em;
    line-height: 1.6;
    padding: 0 20px;
    text-align: justify;
}

.why-choose-title {
    color: #2980b9;
    margin-top: 30px;
}

.benefits-list {
    list-style-type: none;
    padding: 0;
    margin: 20px 0;
}

.benefits-list li {
    background-color: #f1f1f1;
    margin: 10px 0;
    padding: 15px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    font-size: 1.1em;
}

.adventure-awaits-title {
    color: #2c3e50;
    margin-top: 30px;
}

.closing-text {
    color: #34495e;
    font-size: 1.1em;
    line-height: 1.6;
    padding: 0 20px;
    text-align: justify;
}

.partners-title {
    color: #2980b9;
    margin-top: 30px;
}
.card-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px; /* Space between cards */
}

.card {
    width: 18rem; /* Card width */
    border: 1px solid #ddd; /* Border for cards */
    border-radius: 10px; /* Rounded corners */
    overflow: hidden; /* Hide overflow */
    transition: transform 0.2s; /* Smooth hover effect */
}

.card:hover {
    transform: scale(1.05); /* Scale effect on hover */
}

.card-img-top {
    height: 200px; /* Set fixed height for images */
    object-fit: cover; /* Maintain aspect ratio */
}

.card-body {
    text-align: center; /* Center text in card body */
}

.whatsapp-icon {
    height: 25px; /* Size of WhatsApp icon */
    width: 25px; /* Size of WhatsApp icon */
    vertical-align: middle; /* Align icon vertically */
}

h2, h5 {
    color: #2c3e50; /* Header color */
}

.text-muted {
    color: #7f8c8d; /* Muted text color */
}
